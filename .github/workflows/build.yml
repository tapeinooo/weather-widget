name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 署名の鍵は公開リポジトリに置かず、Secret（RELEASE_KEYSTORE_B64）から作る。
      # Secret がないときは、ビルドしない（ほかの鍵で作ったものを出さないため）
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::Secret RELEASE_KEYSTORE_B64 がありません。Mac から入れるまでビルドしません"
            echo "NOKEY=1" >> "$GITHUB_ENV"
          else
            echo "$KEY_B64" | base64 -d > app/release.keystore
          fi
      - name: Build APK
        if: env.NOKEY != '1'
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PbuildNumber=${{ github.run_number }}
      # main への書き込みだけ Releases に出す（アプリの「更新」はここから取る）
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.NOKEY != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(./gradlew -q --no-daemon printVersionName -PbuildNumber=${{ github.run_number }} | tail -1)
          TAG="v${NAME}"
          APK="${{ github.event.repository.name }}-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          git log -1 --pretty=%B > notes.txt
          gh release create "$TAG" "$APK" --title "$TAG" --notes-file notes.txt --target "${{ github.sha }}"
